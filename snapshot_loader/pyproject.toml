[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snapshot-loader"
version = "1.0.0"
description = "Pure-backend watermark-based incremental snapshot loader with an HTTP mock source"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
snapshot-loader = "snapshot_loader.app:main"

[tool.setuptools.packages.find]
where = ["src"]
